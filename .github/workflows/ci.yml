# CI d'OpenScale — docs/02-architecture.md §16.4.
#
# Quatre jobs, et la raison de chacun :
#
#   test    — la qualité. Il fait DEUX passes de `go test` : une avec cgo, parce que
#             `-race` exige ThreadSanitizer, et une sans, parce que c'est la
#             configuration réellement livrée (ADR-001). Un `CGO_ENABLED=0` global
#             casserait `-race`, et le premier contributeur qui rencontre l'erreur
#             retirerait `-race` — on perdrait la seule vérification automatique des
#             invariants de concurrence du Hub (important-3).
#
#   build   — la livraison. Les trois cibles compilent en zéro cgo depuis une machine
#             Linux, sans chaîne C et sans Docker. C'est la contrepartie directe de
#             la contrainte 2, et elle se vérifie à chaque commit plutôt qu'au moment
#             de livrer.
#
#   scripts — les scripts d'installation, sur le SYSTÈME QUI LES EXÉCUTE. Voir sa
#             propre note : ce job existe parce que son absence a livré une v0.1
#             qu'aucun poste ne pouvait installer.
#
#   front   — l'écran client : types, tests et budget de poids.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Épinglé : les golden de rendu de §7.4 ne doivent pas bouger avec la version de
  # la chaîne d'outils.
  GO_VERSION: "1.26.5"

jobs:
  test:
    name: Tests et frontières
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false

      - name: go vet
        run: go vet ./...

      # La passe -race, restreinte à linux/amd64 comme le dit ADR-001.
      - name: go test -race (CGO_ENABLED=1)
        env:
          CGO_ENABLED: "1"
        run: go test ./... -race -count=1

      # La passe qui prouve que la configuration LIVRÉE compile et passe.
      - name: go test (CGO_ENABLED=0)
        env:
          CGO_ENABLED: "0"
        run: go test ./... -count=1

      - name: make boundary
        run: go run ./tools/boundary

      # Les dépendances DÉCLARÉES sont-elles les dépendances RÉELLES ? C'est le
      # contrôle que §17.1 promettait sans qu'il existe, et son absence est la
      # raison pour laquelle la table a annoncé dix modules pour six réels.
      - name: make deps
        run: go run ./tools/deps

      # Les seuils de §16.4. `domain` est le seul paquet livré à ce stade ; les
      # autres entrent avec leur lot, et leur seuil est déjà écrit ici pour qu'il
      # n'y ait pas à y penser ce jour-là.
      - name: Couverture par paquet
        env:
          CGO_ENABLED: "0"
        run: |
          go test ./... -coverprofile=coverage.out -count=1
          go tool cover -func=coverage.out | tail -n 1
          fail=0
          check() {
            package="$1"; floor="$2"
            if ! go list ./... | grep -q "openscale/internal/$package\$"; then
              echo "  $package : paquet absent (lot à venir) — contrôle sauté"
              return
            fi
            measured=$(go test "./internal/$package/..." -coverprofile=/tmp/p.out -count=1 >/dev/null 2>&1 \
              && go tool cover -func=/tmp/p.out | tail -n 1 | grep -oE '[0-9]+\.[0-9]+')
            echo "  $package : $measured % (plancher $floor %)"
            awk -v m="$measured" -v f="$floor" 'BEGIN { exit !(m + 0 >= f + 0) }' || {
              echo "::error::couverture de $package : $measured %, plancher $floor %"
              fail=1
            }
          }
          check domain 95
          # store n'a pas de plancher dans §16.4 : celui-ci est le nôtre, fixé sur ce
          # que le paquet atteint réellement, pour qu'une régression se voie.
          check store 85
          check scale 90
          check printing 80
          check catalog 85
          exit $fail

      - name: Format
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::ces fichiers ne sont pas formatés : $unformatted"
            exit 1
          fi

  # Le seul job qui ne tourne pas sur Linux, et il ne s'agit pas d'un scrupule.
  #
  # deploy/windows/*.ps1 est écrit pour Windows PowerShell 5.1 — common.ps1 le dit dans
  # son en-tête, et c'est le seul PowerShell d'un poste de balance. La CI n'avait que des
  # runners ubuntu, où seul `pwsh` existe : ces scripts n'avaient donc JAMAIS été lus par
  # le shell auquel ils sont destinés. Les deux ne décodent pas de la même façon un
  # fichier sans marque d'ordre des octets, et v0.1 est partie avec cinq scripts que 5.1
  # ne pouvait pas même analyser. `TestEveryPowerShellScriptParses` faisait exactement le
  # bon contrôle, sous le mauvais interpréteur.
  #
  # `-run` plutôt que le paquet entier : ce job répond à « les scripts tournent-ils sur un
  # vrai Windows », pas à « le paquet passe-t-il deux fois ». Le reste de deploy/ est déjà
  # couvert par le job test, et TestTheBackupAndTheRestoreWorkOnAThrowawayDirectory se
  # déclare lui-même Windows seulement : ici est le seul endroit où il s'exécute.
  scripts:
    name: Scripts d'installation, sous Windows PowerShell 5.1
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false

      - name: go test ./deploy
        env:
          CGO_ENABLED: "0"
        run: >
          go test ./deploy/ -count=1 -v
          -run 'TestEveryPowerShellScript|TestTheBackupAndTheRestoreWorkOnAThrowawayDirectory'

  build:
    name: Compilation croisée, zéro cgo
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { goos: windows, goarch: amd64 }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false

      - name: go build ${{ matrix.target.goos }}/${{ matrix.target.goarch }}
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
        run: |
          go build -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_SHA::8}" \
            -o "openscale-${GOOS}-${GOARCH}" ./cmd/openscale
          ls -lh openscale-*

  front:
    name: Écran client — types, tests et budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `npm ci` et non `npm install` : les versions sont exactes dans package.json
      # et gelées dans package-lock.json (§14.1). Un `^` ferait bouger un golden.
      - name: npm ci
        working-directory: web
        run: npm ci

      - name: svelte-check
        working-directory: web
        run: npm run check

      # Les 121 paires de normalisation, la grille sur le catalogue réel, le seuil
      # des puces. Aucun de ces tests ne dort.
      - name: vitest
        working-directory: web
        run: npm test

      - name: npm run build
        working-directory: web
        run: npm run build

      # Le budget de §14.1 : < 110 ko gzip pour l'écran client, administration
      # exclue. Mesuré ici, jamais supposé.
      - name: Budget de l'écran client
        working-directory: web
        run: npm run budget

      # internal/web/dist est COMMITÉ pour que `go build` marche sans Node. Il est
      # donc l'écran RÉELLEMENT LIVRÉ, et la suite de tests ne le regarde jamais :
      # elle lit web/src. Un dist en retard laisse donc tout au vert pendant que le
      # binaire sert un écran périmé.
      #
      # Ce n'est pas une hypothèse. C'est arrivé DEUX FOIS : 706b3ec sur main
      # (« reconstruire le dist embarqué, que la refonte n'avait pas regénéré »),
      # puis sur la branche de reprise de l'administration, où trois commits de
      # correction — dont celui qui cachait les clés de configuration — n'étaient
      # pas dans le bundle. Aucune relecture de code ne peut voir ce défaut : il
      # n'est pas DANS le code, il est dans l'écart entre le code et l'objet livré.
      #
      # La comparaison porte sur les octets, et c'est tenable parce que `npm ci`
      # installe les versions figées du lock : vite, rollup et svelte sont épinglés,
      # et deux constructions successives produisent les mêmes empreintes. Si un
      # changement de version rend un jour cette étape rouge sur un dist pourtant à
      # jour, la réponse est de reconstruire et de committer, jamais de retirer la
      # garde.
      - name: internal/web/dist est à jour
        run: |
          test -f internal/web/dist/index.html
          test -f internal/web/dist/admin.html
          if ! git diff --exit-code --stat internal/web/dist; then
            echo "::error::internal/web/dist est en retard sur web/src. Lancez"        \
                 "'npm --prefix web run build' et committez internal/web/dist :"       \
                 "sans cela le binaire livre l'écran d'avant vos modifications."
            exit 1
          fi
