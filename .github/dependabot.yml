# Surveillance des dépendances — docs/02-architecture.md §17.1.
#
# CE FICHIER EXISTE POUR TROIS ÉCOSYSTÈMES, et le troisième est le moins évident : il
# maintient l'épinglage par SHA des actions de `ci.yml` et de `release.yml`. Épingler une
# action sur un commit protège la chaîne de construction, mais fige aussi ses correctifs ;
# sans cette entrée, l'épinglage devient une dette que personne ne relit. Les deux vont
# ensemble ou aucun des deux ne tient.
#
# La cadence est MENSUELLE et les mises à jour sont GROUPÉES. Une coopérative n'a pas de
# mainteneur à temps plein : une demande par dépendance et par semaine, c'est un dépôt où
# l'on cesse de regarder les demandes — donc un dépôt où la mise à jour de sécurité passe
# inaperçue avec les autres.
#
# MAIS LES MAJEURES VOYAGENT SÉPARÉMENT DES MINEURES, et cette ligne est écrite après un
# échec. La première version de ce fichier groupait tout en `patterns: ["*"]` par
# écosystème. La demande npm qui en est sortie portait six montées, dont TypeScript 7 —
# que `svelte-check` refuse encore (`peer typescript@"^5.0.0 || ^6.0.0"`). Résultat :
# `npm ci` échouait AVANT le premier test, et cinq montées parfaitement saines étaient
# retenues par la sixième, sans autre issue que de fermer la demande entière.
#
# Deux groupes par écosystème coûtent une demande de plus et rendent les mineures
# indépendantes : elles passent seules, et une majeure qui casse peut rester en attente
# aussi longtemps qu'il faut sans rien bloquer. C'est la seule chose qui distingue une
# montée qu'on relit d'une montée qu'on subit.
version: 2
updates:
  # --- Go ---------------------------------------------------------------------------
  # Six modules directs (§17.1). `modernc.org/sqlite` est celui qui compte : c'est lui qui
  # rend le zéro cgo possible, et une montée qui réintroduirait une dépendance C serait
  # refusée par le job `build` de la CI avant toute relecture.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      go:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      go-majeur:
        patterns: ["*"]
        update-types: ["major"]
    commit-message:
      prefix: build(deps)

  # --- Les actions GitHub -----------------------------------------------------------
  # Ce qui fait vivre l'épinglage par SHA. Dependabot remplace le commit ET le commentaire
  # de version au bout de la ligne, donc les deux ne divergent pas.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      actions-majeur:
        patterns: ["*"]
        update-types: ["major"]
    commit-message:
      prefix: ci(deps)

  # --- L'écran client ---------------------------------------------------------------
  # ATTENTION EN RELISANT CES DEMANDES : `internal/web/dist` est commité, et le job `front`
  # de la CI compare ses OCTETS au résultat de `npm ci && npm run build`. Une montée de
  # vite, de rollup ou de svelte change les empreintes des noms de fichiers, donc l'étape
  # « internal/web/dist est à jour » devient rouge sur une demande par ailleurs correcte.
  #
  # La réponse est celle que le workflow écrit déjà : lancer `make front` et committer
  # `internal/web/dist` dans la demande. Jamais retirer la garde — c'est elle qui a
  # rattrapé deux livraisons d'un écran périmé.
  #
  # Tout est en devDependencies : rien de ce bloc ne part sur un poste, seul le bundle
  # construit voyage.
  #
  # C'est ICI que le groupement unique a fait le plus de dégâts, et c'est pourquoi la
  # séparation compte le plus : les dépendances du front sont épinglées à la version
  # EXACTE (§14.1), donc chacune de leurs majeures est une rupture potentielle de peer
  # dependency. TypeScript 7 en est une, et elle attendra dans `front-majeur` que
  # `svelte-check` l'accepte, sans retenir les correctifs des cinq autres.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    versioning-strategy: increase
    groups:
      front:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      front-majeur:
        patterns: ["*"]
        update-types: ["major"]
    commit-message:
      prefix: build(front)
